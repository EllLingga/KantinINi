<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantinGo - Katalog & Pesanan</title>
<link rel="icon" href="IconK.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
    --g: #21a72a;
    --ga: rgba(33, 167, 42, .9);
    --gs: rgba(33, 167, 42, .08);
    --gm: rgba(33, 167, 42, .18);
    --bg: #f8faf8;
    --sh: 0 10px 30px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); font-family: 'Nunito', sans-serif; color: #333; overflow-x: hidden; }

/* Particles */
#particles-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; border-radius: 50%; background: var(--gm); animation: floatP linear infinite; opacity: 0; }
@keyframes floatP {
    0% { transform: translateY(110vh) scale(0); opacity: 0; }
    10% { opacity: .4; }
    90% { opacity: .2; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* Navbar */
.top-navbar { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); box-shadow: 0 2px 15px rgba(0,0,0,0.04); z-index: 1030; position: sticky; top: 0; }
.brand-logo { font-family: 'Pacifico', cursive; color: var(--g); font-size: 1.6rem; }
.nav-lc { font-weight: 700; font-size: .9rem; color: #555; padding: 8px 18px; border-radius: 25px; transition: all .3s; cursor: pointer; text-decoration: none; }
.nav-lc:hover { background: var(--gs); color: var(--g); }
.nav-lc.active { background: var(--g); color: #fff !important; box-shadow: 0 4px 12px rgba(33, 167, 42, 0.3); }

/* Animation */
.page { animation: pgIn .4s ease-out; }
@keyframes pgIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

/* Hero Section */
.hero { 
    min-height: 200px; 
    height: 30vh; 
    background: center/cover no-repeat; 
    position: relative; 
    border-radius: 24px; 
    overflow: hidden; 
    box-shadow: var(--sh); 
}
.hero-ov { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; padding: 20px; }
.hero-title { font-family: 'Pacifico', cursive; font-size: clamp(2rem, 6vw, 3.5rem); text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
.hero-sub { letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; opacity: 0.9; }

/* Cards */
.sc { background: #fff; border-radius: 24px; box-shadow: var(--sh); padding: 25px; border: 1px solid rgba(0,0,0,0.02); }
.menu-card, .best-card { border: none; border-radius: 20px; transition: all .3s; background: #fff; overflow: hidden; }
.menu-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(33, 167, 42, 0.12) !important; }

.menu-card-img { width: 85px; height: 85px; object-fit: cover; border-radius: 16px; }
.add-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--g); border: none; color: #fff; transition: all 0.2s; }
.add-btn:hover { transform: scale(1.1); background: #1a8e22; }

/* Info Cards */
.iic { border-radius: 20px; padding: 20px 15px; text-align: center; background: #fff; height: 100%; transition: 0.3s; }
.iic:hover { transform: translateY(-5px); box-shadow: var(--sh); }
.i-icon { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 15px; }

/* Subtabs & Search */
.sub-tab { display: inline-flex; background: #eee; border-radius: 15px; padding: 4px; }
.sub-tab button { border: none; background: transparent; border-radius: 12px; padding: 6px 16px; font-weight: 700; font-size: .85rem; color: #666; }
.sub-tab button.active { background: #fff; color: var(--g); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.sw input { border-radius: 15px; border: 1px solid #ddd; padding: 12px 15px 12px 45px; width: 100%; transition: 0.3s; }
.sw input:focus { border-color: var(--g); box-shadow: 0 0 0 4px var(--gs); outline: none; }

/* Status Badge */
.status-badge { font-size: .7rem; font-weight: 800; padding: 4px 12px; border-radius: 10px; text-transform: uppercase; margin-top: 5px; }

/* FAB & Bottom Nav */
#fab-cart { width: 60px; height: 60px; z-index: 1050; font-size: 24px; border-radius: 20px; border: none; box-shadow: 0 8px 25px rgba(33, 167, 42, 0.4); }
.bot-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid #eee; padding: 10px 0; }
.nib { color: #aaa; font-size: 11px; font-weight: 700; text-decoration: none; }
.nib.active { color: var(--g); }
.nib i { font-size: 1.5rem; display: block; }

/* Desktop Adjustment */
@media (min-width: 768px) {
    .hero { height: 350px; }
    .container { max-width: 1000px; }
}
</style>
</head>
<body>

<div id="particles-bg"></div>

<!-- Desktop Navbar -->
<nav class="top-navbar d-none d-md-block mb-4">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <span class="brand-logo"><i class="bi bi-shop-window me-2"></i>KantinGo</span>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-lc active" data-target="home" onclick="go('home')">Beranda</a>
            <a class="nav-lc" data-target="makanan" onclick="go('makanan')">Makanan</a>
            <a class="nav-lc" data-target="minuman" onclick="go('minuman')">Minuman</a>
            <button class="btn border-0 position-relative ms-3" data-bs-toggle="modal" data-bs-target="#cartModal">
                <i class="bi bi-bag-heart-fill fs-4 text-success"></i>
                <span id="c-desk" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.7rem;">0</span>
            </button>
        </div>
    </div>
</nav>

<div class="container pb-5 mb-5 mt-3">

    <!-- HOME PAGE -->
    <div id="p-home" class="page">
        <div class="hero mb-4" style="background-image:url('HSekul.jpeg')">
            <div class="hero-ov">
                <h1 class="hero-title">KantinGo</h1>
                <p class="hero-sub">SMKN 5 Surakarta • Lezat & Higienis</p>
            </div>
        </div>

        <!-- Info Grid: 1 Kolom di HP, 3 Kolom di Laptop -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="iic sc">
                    <div class="i-icon" style="background:#fff0f0"><i class="bi bi-geo-alt-fill text-danger"></i></div>
                    <h6 class="fw-800 mb-1">Lokasi</h6>
                    <p class="text-muted small mb-0">Gedung A, Lantai Dasar</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="iic sc">
                    <div class="i-icon" style="background:#fff9e6"><i class="bi bi-clock-fill text-warning"></i></div>
                    <h6 class="fw-800 mb-1">Jam Operasional</h6>
                    <p class="text-muted small mb-0">07:00 – 17:00 WIB</p>
                    <span id="k-status" class="status-badge"></span>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="iic sc">
                    <div class="i-icon" style="background:#eef7ff"><i class="bi bi-lightning-charge-fill text-primary"></i></div>
                    <h6 class="fw-800 mb-1">Layanan</h6>
                    <p class="text-muted small mb-0">Pesan Cepat & Praktis</p>
                </div>
            </div>
        </div>

        <!-- Best Seller -->
        <div class="sc mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-900 m-0"><i class="bi bi-fire text-danger me-2"></i>Paling Laris</h5>
                <button class="btn btn-sm btn-success rounded-pill px-3 fw-bold" onclick="go('makanan')">Semua</button>
            </div>
            <div class="row g-3" id="best-preview"></div>
        </div>

        <!-- Developer Team -->
        <div class="sc text-center">
            <h5 class="fw-800 mb-4">Tim Pengembang</h5>
            <div class="row g-3 justify-content-center" id="team-list"></div>
        </div>
    </div>

    <!-- MAKANAN PAGE -->
    <div id="p-makanan" class="page d-none">
        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <h3 class="fw-900 mb-0">Makanan</h3>
                <small id="count-makanan" class="text-muted"></small>
            </div>
            <div class="sub-tab">
                <button class="active" onclick="filterMenu('makanan','all',this)">Semua</button>
                <button onclick="filterMenu('makanan','best',this)">Populer</button>
            </div>
        </div>
        <div class="sw mb-4">
            <i class="bi bi-search position-absolute ms-3 mt-3 text-muted"></i>
            <input type="text" id="search-makanan" placeholder="Cari menu favoritmu..." oninput="renderMenu('makanan')">
        </div>
        <div class="row g-3" id="l-makanan"></div>
    </div>

    <!-- MINUMAN PAGE -->
    <div id="p-minuman" class="page d-none">
        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <h3 class="fw-900 mb-0">Minuman</h3>
                <small id="count-minuman" class="text-muted"></small>
            </div>
            <div class="sub-tab">
                <button class="active" onclick="filterMenu('minuman','all',this)">Semua</button>
                <button onclick="filterMenu('minuman','best',this)">Dingin</button>
            </div>
        </div>
        <div class="sw mb-4">
            <i class="bi bi-search position-absolute ms-3 mt-3 text-muted"></i>
            <input type="text" id="search-minuman" placeholder="Cari minuman segar..." oninput="renderMenu('minuman')">
        </div>
        <div class="row g-3" id="l-minuman"></div>
    </div>

</div>

<!-- Mobile Nav -->
<nav class="bot-nav fixed-bottom d-md-none shadow-lg">
    <div class="container d-flex justify-content-around">
        <a class="text-center nib active" data-target="home" onclick="go('home')"><i class="bi bi-house-door"></i>Home</a>
        <a class="text-center nib" data-target="makanan" onclick="go('makanan')"><i class="bi bi-egg-fried"></i>Makan</a>
        <a class="text-center nib" data-target="minuman" onclick="go('minuman')"><i class="bi bi-cup-straw"></i>Minum</a>
        <a class="text-center nib position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
            <i class="bi bi-cart3"></i>Cart
            <span id="c-mob" class="position-absolute top-0 start-50 badge rounded-pill bg-danger" style="font-size:10px">0</span>
        </a>
    </div>
</nav>

<!-- FAB Cart (Hanya muncul jika ada isi - opsional) -->
<button class="btn btn-success d-md-none position-fixed shadow-lg" id="fab-cart" 
        style="bottom: 85px; right: 20px; display: none;" data-bs-toggle="modal" data-bs-target="#cartModal">
    <i class="bi bi-bag-check"></i>
</button>

<!-- Modal Cart -->
<div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="fw-800 mb-0">Keranjang Kamu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4" id="c-items"></div>
            <div class="modal-footer border-0 p-4 d-none" id="c-footer">
                <div class="w-100 d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted fw-bold">Total Bayar:</span>
                    <h4 class="fw-900 text-success mb-0" id="c-total">Rp 0</h4>
                </div>
                <button class="btn btn-success w-100 py-3 rounded-4 fw-bold" onclick="checkout()">Pesan Sekarang</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);

const MENU = {
    makanan: [
        {id:1, nama:"Ayam Geprek", harga:7000, desc:"Ayam crispy + sambal bawang", img:"mk1.jpg", kategori:"Lauk", best:true},
        {id:2, nama:"Nasi Goreng", harga:5000, desc:"Nasi goreng telur spesial", img:"mk2.jpg", kategori:"Nasi", best:true},
        {id:3, nama:"Mie Gacoan", harga:5000, desc:"Mie pedas topping pangsit", img:"mk3.jpg", kategori:"Mie", best:false},
        {id:4, nama:"Mini Kebab", harga:3000, desc:"Daging sapi & sayur segar", img:"mk6.jpg", kategori:"Snack", best:false},
        {id:5, nama:"Makaroni Pedas", harga:3000, desc:"Level 0 sampai 10", img:"mk8.jpg", kategori:"Snack", best:false}
    ],
    minuman: [
        {id:101, nama:"Es Teh Manis", harga:3000, desc:"Segar dan manis pas", img:"mn1.jpg", kategori:"Dingin", best:true},
        {id:102, nama:"Aqua Viva", harga:2500, desc:"Air mineral 600ml", img:"mn2.jpg", kategori:"Botol", best:false}
    ]
};

let cart = [];
let filter = { makanan: 'all', minuman: 'all' };

// Navigasi
const go = id => {
    $$('.page').forEach(p => p.classList.add('d-none'));
    $(`p-${id}`).classList.remove('d-none');
    $$('.nav-lc, .nib').forEach(n => n.classList.remove('active'));
    $$(`[data-target="${id}"]`).forEach(n => n.classList.add('active'));
    window.scrollTo(0,0);
};

// Format Rupiah
const rp = n => "Rp " + n.toLocaleString('id-ID');

// Render Menu
const renderMenu = t => {
    const query = $(`search-${t}`).value.toLowerCase();
    const items = MENU[t].filter(i => {
        const matchSearch = i.nama.toLowerCase().includes(query);
        const matchFilter = filter[t] === 'best' ? i.best : true;
        return matchSearch && matchFilter;
    });

    $(`count-${t}`).innerText = `${items.length} menu ditemukan`;
    $(`l-${t}`).innerHTML = items.map(i => `
        <div class="col-12 col-md-6">
            <div class="card menu-card shadow-sm p-3">
                <div class="d-flex align-items-center gap-3">
                    <img src="${i.img}" class="menu-card-img" onerror="this.src='https://placehold.co/100x100?text=Food'">
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">${i.nama}</h6>
                        <p class="text-muted small mb-2">${i.desc}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-900 text-success">${rp(i.harga)}</span>
                            <button class="add-btn" onclick="addToCart(${i.id}, '${t}')"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
};

const filterMenu = (t, val, btn) => {
    filter[t] = val;
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(t);
};

// Cart Logic
const addToCart = (id, type) => {
    const item = MENU[type].find(i => i.id === id);
    const existing = cart.find(c => c.id === id);
    if(existing) existing.qty++;
    else cart.push({...item, qty: 1});
    updateCartUI();
    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Ditambahkan!', showConfirmButton: false, timer: 1500 });
};

const updateCartUI = () => {
    const totalQty = cart.reduce((a, b) => a + b.qty, 0);
    const totalPrice = cart.reduce((a, b) => a + (b.harga * b.qty), 0);
    
    $('c-desk').innerText = $('c-mob').innerText = totalQty;
    $('c-total').innerText = rp(totalPrice);
    $('fab-cart').style.display = totalQty > 0 ? 'block' : 'none';

    if(cart.length === 0) {
        $('c-items').innerHTML = `<div class="text-center py-5 text-muted"><i class="bi bi-cart-x fs-1"></i><p>Keranjang kosong</p></div>`;
        $('c-footer').classList.add('d-none');
    } else {
        $('c-footer').classList.remove('d-none');
        $('c-items').innerHTML = cart.map(c => `
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-0">${c.nama}</h6>
                    <small class="text-success fw-bold">${rp(c.harga)}</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-light rounded-circle" onclick="changeQty(${c.id}, -1)">-</button>
                    <span class="fw-bold">${c.qty}</span>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="changeQty(${c.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }
};

const changeQty = (id, delta) => {
    const item = cart.find(c => c.id === id);
    item.qty += delta;
    if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
    updateCartUI();
};

const checkout = () => {
    Swal.fire({
        title: 'Konfirmasi Pesanan',
        text: "Pesanan akan diteruskan ke kasir.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#21a72a',
        confirmButtonText: 'Ya, Pesan!'
    }).then((result) => {
        if (result.isConfirmed) {
            Swal.fire('Berhasil!', 'Silakan menuju kasir untuk pembayaran.', 'success');
            cart = [];
            updateCartUI();
            bootstrap.Modal.getInstance($('cartModal')).hide();
        }
    });
};

// Team & Misc
const renderHome = () => {
    const best = [...MENU.makanan, ...MENU.minuman].filter(i => i.best).slice(0,4);
    $('best-preview').innerHTML = best.map(i => `
        <div class="col-6 col-md-3">
            <div class="best-card shadow-sm p-2 text-center h-100">
                <img src="${i.img}" class="img-fluid rounded-3 mb-2" style="height:100px; object-fit:cover" onerror="this.src='https://placehold.co/100x100'">
                <h6 class="small fw-bold mb-1 text-truncate">${i.nama}</h6>
                <p class="text-success fw-900 small mb-0">${rp(i.harga)}</p>
            </div>
        </div>
    `).join('');

    const team = [
        {n:"Andika", r:"Lead", c:"#4a90e2"},
        {n:"Faathir", r:"UI/UX", c:"#21a72a"},
        {n:"Lingga", r:"Dev", c:"#f59e0b"}
    ];
    $('team-list').innerHTML = team.map(t => `
        <div class="col-4">
            <div class="p-2">
                <div class="mx-auto mb-2" style="width:50px; height:50px; background:${t.c}; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold">${t.n[0]}</div>
                <h6 class="small fw-bold mb-0">${t.n}</h6>
                <small class="text-muted" style="font-size:10px">${t.r}</small>
            </div>
        </div>
    `).join('');
};

const cekKantin = () => {
    const jam = new Date().getHours();
    const buka = jam >= 7 && jam < 17;
    const el = $('k-status');
    el.innerText = buka ? "Buka Sekarang" : "Sudah Tutup";
    el.className = `status-badge ${buka ? 'bg-success text-white' : 'bg-danger text-white'}`;
};

// Init
window.onload = () => {
    renderHome();
    renderMenu('makanan');
    renderMenu('minuman');
    cekKantin();
};
</script>
</body>
</html>
